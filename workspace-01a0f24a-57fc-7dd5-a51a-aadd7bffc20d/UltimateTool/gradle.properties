# Оптимизировано под сборку на машине с ~2 ГБ RAM (без свапа).
# Двухфазная сборка на машине с 2 ГБ RAM:
#  фаза 1 (компиляция+KSP): больше метапространства, меньше куча;
#  фаза 2 (dex-мерж, тесты): больше куча — см. gradle-dex.properties.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=448m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
# Kotlin-компилятор в процессе Gradle: один JVM вместо двух (экономия памяти).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
